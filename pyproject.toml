[project]
name = "affective-fly"
version = "0.2.5"
description = "Reduced Drosophila mushroom-body circuit as the affect source for emotional-memory"
authors = [
    {name = "Gianluca Mazza"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "emotional-memory[sqlite]>=0.18.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/gianlucamazza/affective-fly"
Releases = "https://github.com/gianlucamazza/affective-fly/releases"

[project.scripts]
affective-fly = "affective_fly.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
brian = [
    "brian2>=2.5.0,<2.10.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
embed = [
    "sentence-transformers>=2.2.0",
]
connectome = [
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/test_brian2_circuit.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:brian2",
    "ignore::DeprecationWarning:pyparsing",
]
