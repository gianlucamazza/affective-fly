name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --extra dev --extra brian --extra viz
      - name: Lint
        run: uv run ruff check src/ tests/ examples/
      - name: Test
        run: uv run pytest tests/ -v
